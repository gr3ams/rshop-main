<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Фон с градиентом -->
  <rect width="100" height="100" rx="22" fill="url(#grad)"/>
  
  <!-- Буква R -->
  <text x="50" y="72" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="white" text-anchor="middle" filter="url(#shadow)">R</text>
  
  <!-- Декоративные элементы -->
  <circle cx="20" cy="20" r="3" fill="white" opacity="0.3"/>
  <circle cx="80" cy="20" r="3" fill="white" opacity="0.3"/>
  <circle cx="20" cy="80" r="3" fill="white" opacity="0.3"/>
  <circle cx="80" cy="80" r="3" fill="white" opacity="0.3"/>
</svg>
